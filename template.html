<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>סיור משפחתי – שוק תלפיות</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif}
#map{position:absolute;inset:56px 0 0 0}
header{position:fixed;top:0;left:0;right:0;height:56px;background:#c2410c;color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:1000}
header h1{font-size:16px;margin:0;flex:1}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:#fff;color:#c2410c;font-weight:600;cursor:pointer}
button.pri{background:#c2410c;color:#fff}
#status{position:fixed;top:62px;right:10px;left:10px;z-index:900;background:#fffc;border-radius:10px;padding:6px 10px;font-size:13px;text-align:center}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px #0004;z-index:1100;padding:14px 16px 20px;transform:translateY(110%);transition:.25s}
.sheet.open{transform:none}
.sheet h2{margin:4px 0 6px;font-size:19px}.close{position:absolute;left:12px;top:10px;background:#eee;color:#333}
.box{border-radius:12px;padding:10px;margin:8px 0;line-height:1.5}.par{background:#fff7ed}.kid{background:#ecfdf5}.vid{background:#1f2937;color:#fff;min-height:64px;padding:8px;font-size:12px!important;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row button{flex:1;border:1px solid #c2410c}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.num{width:30px;height:30px;border-radius:50%;background:#c2410c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.num.v{background:#16a34a}.num.cur{outline:3px solid #facc15}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px #2563eb44}
.me.sim{background:#9333ea;box-shadow:0 0 0 6px #9333ea44}
label{font-size:14px}
#setup{position:fixed;inset:0;background:#fff7ed;z-index:2000;overflow:auto;padding:16px}
#setup.hidden{display:none}#setup h2{color:#c2410c;margin:4px 0 12px}
.fld{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0001}
.fld>b{display:block;margin-bottom:8px}select,input[type=text]{width:100%;font:inherit;padding:8px;border:1px solid #ccc;border-radius:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;border:1px solid #c2410c;min-width:70px}.seg button.on{background:#c2410c;color:#fff}
.seg button small{display:block;font-weight:400;font-size:11px}
.step{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.step span{display:flex;align-items:center;gap:10px}
.step button{width:38px;height:38px;padding:0;border:1px solid #c2410c;font-size:20px}
.note{background:#fef3c7;border:2px solid #f59e0b;border-radius:12px;padding:12px;font-weight:600;line-height:1.5}
.ages input{width:60px;margin:4px}#notice{font-size:13px;color:#b45309;margin-top:6px}
#chip{position:fixed;bottom:14px;right:10px;left:10px;z-index:900;background:#fff;border-radius:20px;box-shadow:0 2px 8px #0004;padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
#chip span{flex:1}#chip button{padding:5px 10px;border:1px solid #c2410c}
</style></head><body>
<header><h1>🧺 שוק תלפיות – סיור משפחתי</h1><button id="bList">תחנות</button><button id="bMenu">⚙️</button></header>
<div id="setup" class="hidden"><h2>🧭 בואו נתכנן את הסיור</h2>
<div class="note">⚠️ הסיורים מיועדים כרגע לסיורי הליכה באזורים עירוניים בלבד. טיולים בטבע וסיורים ברכב יתווספו בעתיד.</div>
<div class="fld"><b>📍 אזור הסיור</b><select id="sArea"><option value="talpiot">שוק תלפיות, חיפה (משפחות)</option><option value="tlv">תל אביב – העיר הלבנה (מבוגרים)</option>
<option value="germancolony">המושבה הגרמנית, חיפה</option><option value="jaffa">יפו העתיקה</option><option value="mahaneyehuda">שוק מחנה יהודה, ירושלים</option></select>
<input type="text" id="sReq" placeholder="בקשו אזור חדש (למשל: נחלת בנימין, תל אביב)" style="margin-top:8px"><div id="reqOk" style="font-size:13px;color:#16a34a"></div></div>
<div class="fld"><b>⏱️ משך הסיור</b><div class="seg" id="sDur"></div><div id="durNote" style="font-size:13px;color:#666;margin-top:6px"></div></div>
<div class="fld"><b>🗣️ שפת ההדרכה</b><div class="seg" id="sLang"></div><div id="notice"></div></div>
<div class="fld"><b>👨‍👩‍👧‍👦 משתתפים</b>
<div class="step">מבוגרים<span><button onclick="cnt('adults',1)">+</button><b id="vAd"></b><button onclick="cnt('adults',-1)">−</button></span></div>
<div class="step">ילדים<span><button onclick="cnt('kids',1)">+</button><b id="vKi"></b><button onclick="cnt('kids',-1)">−</button></span></div>
<div class="ages" id="ages"></div><label id="kidOpt"></label></div>
<button class="pri" style="width:100%;padding:14px;font-size:18px" onclick="startTour()">יוצאים לסיור! 🚶</button></div>
<div id="chip"><span id="chipTxt"></span><button onclick="openSetup()">✏️ עריכה</button></div>
<div id="map"></div><div id="status">מאתר מיקום…</div>
<div class="sheet" id="card"></div>
<div class="sheet" id="list"></div>
<div class="sheet" id="menu"></div>
<script>
let openN=null,lastAuto=null;
const TOURS={talpiot:{name:'שוק תלפיות, חיפה',title:'🧺 שוק תלפיות – סיור משפחתי',stations:/*S*/,route:/*R*/},tlv:{name:'תל אביב – העיר הלבנה',title:'🏛️ העיר הלבנה – סיור באוהאוס',stations:/*S2*/,route:/*R2*/},germancolony:{name:'המושבה הגרמנית, חיפה',title:'🏘️ המושבה הגרמנית – חיפה',stations:/*S3*/,route:/*R3*/},jaffa:{name:'יפו העתיקה',title:'⚓ יפו העתיקה',stations:/*S4*/,route:/*R4*/},mahaneyehuda:{name:'שוק מחנה יהודה, ירושלים',title:'🍎 שוק מחנה יהודה',radius:40,stations:/*S5*/,route:/*R5*/}};let STATIONS,ROUTE,TOUR;
const LS='talpiot_tour_v1';
let st=JSON.parse(localStorage.getItem(LS)||'{}');
st.tours=st.tours||{};if(st.visited&&!st.tours.talpiot)st.tours.talpiot={visited:st.visited,cur:st.cur||1};st.radius=st.radius||30;st.cur=st.cur||1;st.sim=!!st.sim;
const save=()=>{if(TOUR)st.tours[TOUR]={visited:st.visited,cur:st.cur,radius:st.radius};localStorage.setItem(LS,JSON.stringify(st))};
const $=id=>document.getElementById(id);
const map=L.map('map',{zoomControl:false}).setView([32.8124,34.9995],18);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
let line=null,markers={},layer=L.layerGroup().addTo(map);
function icon(s){return L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],html:`<div class="num ${st.visited.includes(s.n)?'v':''} ${st.cur===s.n?'cur':''}">${st.visited.includes(s.n)?'✓':s.n}</div>`})}
function loadTour(t){if(!TOURS[t])t='talpiot';TOUR=t;const T=TOURS[t];STATIONS=T.stations;ROUTE=T.route;
 const p=st.tours[t]||{visited:[],cur:1};st.visited=p.visited;st.cur=p.cur;st.radius=p.radius||T.radius||30;lastAuto=null;
 layer.clearLayers();markers={};hide('card');hide('list');
 line=L.polyline(ROUTE?ROUTE.coords:STATIONS.map(s=>[s.lat,s.lng]),{color:'#c2410c',weight:5,opacity:.8,dashArray:ROUTE?null:'8 8'}).addTo(layer);
 const placed=[];STATIONS.forEach(s=>{let la=s.lat,ln=s.lng,k=placed.filter(p=>map.distance(p,[s.lat,s.lng])<15).length;
  if(k){const a=k*Math.PI/2+Math.PI/4,d=12;la+=d*Math.sin(a)/111320;ln+=d*Math.cos(a)/(111320*Math.cos(s.lat*Math.PI/180))}placed.push([s.lat,s.lng]);
  markers[s.n]=L.marker([la,ln],{icon:icon(s),zIndexOffset:s.n*10}).addTo(layer).on('click',e=>{L.DomEvent.stopPropagation(e);markerTap(s.n)})});
 document.querySelector('header h1').textContent=T.title;document.title=T.title.replace(/^\S+\s/,'');
 map.invalidateSize();map.fitBounds(line.getBounds(),{padding:[40,40]});save();refresh()}
const refresh=()=>{STATIONS.forEach(s=>markers[s.n].setIcon(icon(s)));renderList()};
const byN=n=>STATIONS.find(s=>s.n===n);
function openCard(n,auto){const s=byN(n);openN=n;st.cur=n;save();hide('list');hide('menu');
 const v=st.visited.includes(n);
 $('card').innerHTML=`<button class="close" onclick="hide('card')">✕</button>
 <div style="color:#888;font-size:13px">תחנה ${n} מתוך ${STATIONS.length}${auto?' · הגעתם! 📍':''}</div><h2>${s.name}</h2>
 <div style="font-size:13px;color:#555">📍 ${s.where}<br>🚶 ${s.dir}</div>
 <div class="box vid">▶️ סרטון התחנה (בקרוב)<br><small style="opacity:.8">${s.video}</small></div>
 <div class="box par"><b>👨‍👩‍👧‍👦 להורים:</b><br>${s.parents}</div>
 ${s.kids&&kidsOn()?`<div class="box kid"><b>🧒 משימה לילדים:</b><br>${s.kids}</div>`:''}${s.q?`<div class="box kid"><b>❓ שאלת התבוננות:</b><br>${s.q}</div>`:''}
 <div class="row"><button onclick="toggleVisit(${n})">${v?'↩️ בטל סימון':'✅ סמן כבוקר'}</button>
 ${n<STATIONS.length?`<button class="pri" onclick="goNext(${n})">לתחנה הבאה ←</button>`:'<button class="pri" onclick="hide(\'card\')">🎉 סיום הסיור</button>'}
 <button onclick="showList()">תחנה אחרת</button></div>`;
 show('card');refresh()}
function markerTap(n){const s=byN(n);if(st.sim){onPos(s.lat,s.lng);if(openN!==n)openCard(n,true)}else openCard(n)}
function markVisited(n){if(!st.visited.includes(n)){st.visited.push(n);save();refresh()}}
function toggleVisit(n){st.visited.includes(n)?st.visited=st.visited.filter(x=>x!==n):st.visited.push(n);save();openCard(n)}
function goNext(n){markVisited(n);const nx=byN(n+1);st.cur=nx.n;save();hide('card');refresh();map.flyTo([nx.lat,nx.lng],19);status(`ממשיכים לתחנה ${nx.n}: ${nx.name}`)}
function renderList(){$('list').innerHTML=`<button class="close" onclick="hide('list')">✕</button><h2>תחנות הסיור</h2><div style="font-size:13px;color:#666">בוקרו ${st.visited.length} מתוך ${STATIONS.length}${ROUTE?` · כ-${Math.round(ROUTE.dist)} מ' הליכה`:''}</div>`+
 STATIONS.map(s=>`<div class="list-item" onclick="jump(${s.n})"><div class="num ${st.visited.includes(s.n)?'v':''}">${st.visited.includes(s.n)?'✓':s.n}</div><div><b>${s.name}</b><br><small>${s.where}</small></div></div>`).join('')}
function jump(n){const s=byN(n);map.flyTo([s.lat,s.lng],19);openCard(n)}
function showList(){hide('card');hide('menu');renderList();show('list')}
function show(id){$(id).classList.add('open')}function hide(id){$(id).classList.remove('open');if(id==='card')openN=null}
function status(t){$('status').textContent=t}
function renderMenu(){$('menu').innerHTML=`<button class="close" onclick="hide('menu')">✕</button><h2>הגדרות</h2>
 <p><label><input type="checkbox" id="simCb" ${st.sim?'checked':''}> מצב הדגמה – הקישו על המפה כדי לקבוע מיקום מדומה</label></p>
 <p><label>רדיוס הגעה לתחנה: <b id="rv">${st.radius}</b> מ'<br><input type="range" min="10" max="100" step="5" value="${st.radius}" id="rad" style="width:100%"></label></p>
 <div class="row"><button onclick="if(confirm('לאפס את כל הסימונים?')){st.visited=[];st.cur=1;lastAuto=null;save();refresh();hide('menu')}">🔄 איפוס הסיור</button></div>`;
 $('simCb').onchange=e=>{st.sim=e.target.checked;save();setupGeo()};
 $('rad').oninput=e=>{st.radius=+e.target.value;$('rv').textContent=st.radius;save();circ&&circ.setRadius(st.radius)}}
$('bList').onclick=showList;$('bMenu').onclick=()=>{hide('card');hide('list');renderMenu();show('menu')};
let me=null,circ=null,watch=null;
function onPos(lat,lng,acc){const ll=[lat,lng];
 if(!me){me=L.marker(ll,{icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],html:'<div class="me"></div>'}),zIndexOffset:1000}).addTo(map)}else me.setLatLng(ll);
 me.getElement()&&me.getElement().firstChild.classList.toggle('sim',st.sim);
 let best=null,bd=1e9;STATIONS.forEach(s=>{const d=map.distance(ll,[s.lat,s.lng]);if(d<bd){bd=d;best=s}});
 if(bd<=st.radius){status(`📍 אתם בתחנה ${best.n}: ${best.name}`);if(lastAuto!==best.n){lastAuto=best.n;markVisited(best.n);openCard(best.n,true)}}
 else{if(bd>st.radius*1.5)lastAuto=null;const c=byN(st.cur)||best;status(`${st.sim?'🧪 הדגמה · ':''}${Math.round(map.distance(ll,[c.lat,c.lng]))} מ' לתחנה ${c.n}: ${c.name}${acc?` (דיוק ±${Math.round(acc)} מ')`:''}`)}}
function setupGeo(){if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}
 if(st.sim){status('🧪 מצב הדגמה: הקישו על המפה כדי "ללכת"');return}
 if(!navigator.geolocation){status('הדפדפן לא תומך במיקום – הפעילו מצב הדגמה ב-⚙️');return}
 watch=navigator.geolocation.watchPosition(p=>onPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
  e=>status('אין גישה למיקום ('+e.message+') – אפשר לבחור תחנה ידנית או להפעיל מצב הדגמה ב-⚙️'),{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
map.on('click',e=>{if(st.sim)onPos(e.latlng.lat,e.latlng.lng)});
window.__tour={onPos,get STATIONS(){return STATIONS},loadTour,get su(){return su},get st(){return st},startTour,cnt};

const DURS=[[60,'שעה'],[90,'1.5 שעות'],[120,'2 שעות']];
const LANGS=[['he','עברית',1],['en','English',0],['ar','العربية',0],['ru','Русский',0]];
const AREAS=Object.fromEntries(Object.entries(TOURS).map(([k,v])=>[k,v.name]));
let su=st.setup?JSON.parse(JSON.stringify(st.setup)):{area:'talpiot',dur:90,lang:'he',adults:2,kids:2,ages:['8','10'],showKids:true,req:''};
function cnt(k,d){su[k]=Math.max(k==='adults'?1:0,Math.min(10,su[k]+d));if(k==='kids'){su.ages=su.ages.slice(0,su.kids);while(su.ages.length<su.kids)su.ages.push('');if(!su.kids)su.showKids=false}renderSetup()}
function renderSetup(){
 $('sDur').innerHTML=DURS.map(([m,l])=>`<button class="${su.dur===m?'on':''}" onclick="su.dur=${m};renderSetup()">${l}</button>`).join('');
 $('durNote').textContent=su.dur===60?'בשעה: מומלץ לעבור בתחנות בקצב מהיר ולדלג על עצירות אוכל ארוכות.':su.dur===120?'בשעתיים: זמן לטעימות, קניות ומשחקים בכל תחנה.':'הקצב המומלץ למסלול הנוכחי (8 תחנות).';
 $('sLang').innerHTML=LANGS.map(([c,l,ok])=>`<button class="${su.lang===c?'on':''}" onclick="su.lang='${c}';renderSetup()">${l}${ok?'':'<small>בקרוב</small>'}</button>`).join('');
 $('notice').textContent=su.lang==='he'?'':'התוכן בשפה זו עדיין בהכנה – הסיור יוצג כרגע בעברית.';
 $('vAd').textContent=su.adults;$('vKi').textContent=su.kids;
 $('ages').innerHTML=su.kids?'גילאי הילדים (לא חובה): '+su.ages.map((a,i)=>`<input type="number" min="1" max="17" value="${a}" oninput="su.ages[${i}]=this.value" placeholder="גיל">`).join(''):'';
 $('kidOpt').innerHTML=su.kids?'':`<input type="checkbox" ${su.showKids?'checked':''} onchange="su.showKids=this.checked"> להציג בכל זאת משימות לילדים`;
 $('sArea').value=su.area;$('sReq').value=su.req||''}
$('sArea').onchange=e=>{su.area=e.target.value};$('sReq').onchange=e=>{su.req=e.target.value.trim();$('reqOk').textContent=su.req?'✓ הבקשה נשמרה – נעדכן כשהאזור יהיה זמין':''};
function openSetup(){hide('card');hide('list');hide('menu');su=JSON.parse(JSON.stringify(st.setup||su));renderSetup();$('setup').classList.remove('hidden')}
function startTour(){su.area=$('sArea').value;if(su.kids>0)su.showKids=true;loadTour(su.area);st.setup=JSON.parse(JSON.stringify(su));save();$('setup').classList.add('hidden');renderChip();setTimeout(()=>map.invalidateSize(),50)}
function kidsOn(){return !st.setup||st.setup.kids>0||st.setup.showKids}
function renderChip(){const s=st.setup;if(!s){$('chip').style.display='none';return}$('chip').style.display='';
 const ag=s.ages.filter(Boolean);$('chipTxt').textContent=`📍 ${AREAS[s.area]} · ⏱️ ${DURS.find(d=>d[0]===s.dur)[1]} · 🗣️ ${LANGS.find(l=>l[0]===s.lang)[1]} · 👤${s.adults} 🧒${s.kids}${ag.length?' ('+ag.join(', ')+')':''}`}
renderChip();openSetup();
loadTour((st.setup&&st.setup.area)||'talpiot');setupGeo();
</script></body></html>
